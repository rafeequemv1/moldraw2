<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MolDraw settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="brand">
      <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#2C7A7B"/>
        <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4.6 L25.5 10.1 L25.5 21.9 L16 27.4 L6.5 21.9 L6.5 10.1 Z" stroke-width="2.2"/>
          <path d="M23.95 11.2 L23.95 20.8" stroke-width="1.55"/>
          <path d="M16.55 6.15 L8.2 10.95" stroke-width="1.55"/>
          <path d="M8.2 21.05 L16.55 25.85" stroke-width="1.55"/>
        </g>
      </svg>
      <span>MolDraw</span>
    </header>

    <p class="lede">Keys stay in Chrome sync storage. They are never shipped in this plugin.</p>

    <label for="appId">Mathpix app_id</label>
    <input id="appId" type="text" autocomplete="off" spellcheck="false" />

    <label for="appKey">Mathpix app_key</label>
    <input id="appKey" type="password" autocomplete="off" spellcheck="false" />

    <p class="hint">Create keys in your <a href="https://accounts.mathpix.com/" target="_blank" rel="noreferrer">Mathpix account</a>. This plugin does not provide API keys.</p>

    <fieldset>
      <legend>Open in MolDraw</legend>
      <label class="row"><input type="radio" name="target" value="production" /> https://moldraw.com</label>
      <label class="row"><input type="radio" name="target" value="local" /> http://127.0.0.1:5173 (local)</label>
      <label class="row"><input type="radio" name="target" value="both" /> Both</label>
    </fieldset>

    <label class="row auto">
      <input id="autoOpen" type="checkbox" />
      Open automatically after a successful conversion
    </label>

    <button id="save" class="btn" type="button">Save</button>
    <p id="status" class="status" role="status"></p>

    <script type="module" src="options.js"></script>
  </body>
</html>
