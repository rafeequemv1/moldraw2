<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MolDraw</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#2C7A7B"/>
        <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4.6 L25.5 10.1 L25.5 21.9 L16 27.4 L6.5 21.9 L6.5 10.1 Z" stroke-width="2.2"/>
          <path d="M23.95 11.2 L23.95 20.8" stroke-width="1.55"/>
          <path d="M16.55 6.15 L8.2 10.95" stroke-width="1.55"/>
          <path d="M8.2 21.05 L16.55 25.85" stroke-width="1.55"/>
        </g>
      </svg>
      <span>MolDraw</span>
    </header>

    <p class="lede">Capture a molecule on this page and open it editable.</p>

    <button id="capture" class="btn primary" type="button">Capture molecule</button>

    <p id="status" class="status" role="status">Ready</p>

    <img id="preview" class="preview" alt="Captured molecule" hidden />
    <code id="smiles" class="smiles" hidden></code>

    <button id="open" class="btn primary" type="button" hidden>Open in MolDraw</button>

    <footer>
      <button id="settings" class="link" type="button">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
